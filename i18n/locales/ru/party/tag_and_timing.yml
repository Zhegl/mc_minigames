hot_potato.rules: "Если картошка у тебя, нажми ПКМ по игроку рядом, чтобы передать её. Убегай от светящегося игрока. У кого картошка останется к концу таймера, тот выбывает."
hot_potato.practice_rules: "Одиночная тренировка. Передай картошку манекену с тыквой, нажав по нему ПКМ, пока не вышло время. У тебя три попытки."
hot_potato.practice_success: "Ты успел передать картошку!"
hot_potato.practice_missed: "Картошка взорвалась у тебя в руках. В следующий раз нажми ПКМ по манекену раньше."
hot_potato.practice_carrier: "<arg:0> с • Нажми ПКМ по манекену с тыквой"

instructions: "Выполни <arg:0> случайных заданий в своей комнате. Каждое задание начинается сразу и приносит одно очко за выполнение. При равном счёте игроки делят место."
task_start: "Задание <arg:0>/<arg:1> • <arg:2>"
detail: "<arg:0> (<arg:2> с) — <arg:1>"
timer: "<arg:0> • Осталось <arg:1> с"
waiting: "Готово! +1 очко • <arg:0>"
success_task: "Задание «<arg:0>» выполнено! +1 очко."
missed_task: "Время на задание «<arg:0>» вышло."
score: "Заданий выполнено <arg:0>/<arg:1>"
task_number: "Задание <arg:0>/<arg:1>"
spectating: "Наблюдение"
task.flower.name: "Собери букет"
task.flower.hint: "ЛКМ по маку, васильку и луку-батуну"
task.flower.detail: "Осмотри четыре клумбы. Левой кнопкой мыши сорви красный мак, синий василёк и круглый фиолетовый лук-батун."
task.flower.progress: "Мак <arg:0>/1 • Василёк <arg:1>/1 • Лук-батун <arg:2>/1"
task.craft.name: "Смастери деревянную кирку"
task.craft.hint: "Доски в верхнем ряду • Палки под средней доской"
task.craft.detail: "Открой верстак. Возьми стопку ингредиентов и щёлкай правой кнопкой по каждой клетке, чтобы положить один предмет. Заполни верхний ряд досками, положи две палки под средней доской и забери кирку."
task.crop.name: "Собери спелый урожай"
task.crop.hint: "ЛКМ по зрелой пшенице и моркови"
task.crop.detail: "Найди все зрелые растения. Собирай левой кнопкой мыши высокую золотистую пшеницу и морковь с видимыми оранжевыми корнеплодами."
task.crop.progress: "Пшеница <arg:0>/<arg:1> • Морковь <arg:2>/<arg:3>"
task.button.name: "Найди обе кнопки"
task.button.hint: "ПКМ по двум спрятанным каменным кнопкам"
task.button.detail: "Осмотри столбы сбоку и сзади. Найди две серые каменные кнопки и нажми каждую правой кнопкой мыши."
task.button.progress: "Каменные кнопки <arg:0>/2 • ПКМ"
progress: "<arg:0> • <arg:1>/<arg:2>"
task.logs.name: "Наруби четыре бревна"
task.logs.hint: "Сруби два еловых и два берёзовых бревна"
task.logs.detail: "Возьми топор и удерживай левую кнопку мыши. Сруби два тёмных еловых и два белых берёзовых бревна."
task.logs.progress: "Ель <arg:0>/2 • Берёза <arg:1>/2"
task.ores.name: "Добудь два вида руды"
task.ores.hint: "Добудь два блока медной и два блока железной руды"
task.ores.detail: "Возьми кирку и удерживай левую кнопку мыши. Добудь два блока с оранжево-зелёными вкраплениями и два с бежевыми."
task.ores.progress: "Медь <arg:0>/2 • Железо <arg:1>/2"
task.webs.name: "Расчисти паутину"
task.webs.hint: "Срежь мечом все шесть паутин"
task.webs.detail: "Возьми меч и удерживай левую кнопку мыши, чтобы срезать каждую из шести паутин."
task.ladder.name: "Смастери лестницу"
task.ladder.hint: "Выложи букву Н семью палками"
task.ladder.detail: "Открой верстак. Возьми стопку палок и щёлкай правой кнопкой по каждой клетке, чтобы положить одну палку. Заполни оба крайних столбца и центральную клетку, затем забери лестницы."
task.boots.name: "Смастери кожаные ботинки"
task.boots.hint: "По два куска кожи в крайних столбцах"
task.boots.detail: "Открой верстак. Возьми стопку кожи и щёлкай правой кнопкой по каждой клетке, чтобы положить один кусок. Заполни две верхние клетки каждого крайнего столбца и забери ботинки."
task.stack.name: "Построй цветную башню"
task.stack.hint: "Поставь красный, жёлтый, затем синий блок"
task.stack.detail: "Поставь красный бетон на золотой блок правой кнопкой мыши, затем поставь жёлтый и синий блоки сверху. Чтобы дотянуться до верха, запрыгни на каменную ступень рядом."
task.light.name: "Освети золотые площадки"
task.light.hint: "Поставь факел на каждый золотой блок"
task.light.detail: "Возьми факелы и нажми правой кнопкой мыши по верхней грани каждого из трёх золотых блоков в полу."
task.levers.name: "Переключи три рычага"
task.levers.hint: "Нажми ПКМ по всем трём рычагам"
task.levers.detail: "Осмотри серые тумбы. Нажми правой кнопкой мыши на каждый из трёх рычагов."
task.treasure.name: "Забери спрятанный изумруд"
task.treasure.hint: "Поищи изумруд в бочках"
task.treasure.detail: "Открой бочку правой кнопкой мыши. Нажми Esc, чтобы закрыть её и проверить другую. Забери изумруд левой кнопкой мыши."
task.checkpoints.name: "Пробеги по цветным площадкам"
task.checkpoints.hint: "Встань на зелёную, жёлтую и красную площадки по порядку"
task.checkpoints.detail: "Пробеги по трём площадкам. Сначала встань на зелёную, затем на жёлтую и красную."
task.parkour.name: "Перепрыгни три платформы"
task.parkour.hint: "Прыгни на зелёную, жёлтую и красную по порядку"
task.parkour.detail: "Кнопкой прыжка запрыгни на зелёную платформу. Оттуда перепрыгни на жёлтую, затем на красную. Если упадёшь, заберись снова."
task.targets.name: "Попади в три мишени"
task.targets.hint: "Выстрели в каждый из трёх блоков-мишеней"
task.targets.detail: "Удерживай правую кнопку мыши, чтобы натянуть лук. Наведись на мишень и отпусти кнопку. Нужно попасть по разу в каждую мишень."

task.flower.name: "Pick a Bouquet"
task.flower.hint: "Left-click one poppy, cornflower, and allium"
task.flower.detail: "Search the four flowerbeds. Left-click a red poppy, a blue cornflower, and a round purple allium."
task.flower.progress: "Poppy <arg:0>/1 • Cornflower <arg:1>/1 • Allium <arg:2>/1"
task.craft.name: "Craft a Wooden Pickaxe"
task.craft.hint: "Planks across the top • Sticks down the middle"
task.craft.detail: "Open the crafting table. Pick up a stack and right-drag to place one item per square. Fill the top row with planks. Put a stick in each of the two squares below the center plank and take the pickaxe."
task.crop.name: "Harvest the Ripe Crops"
task.crop.hint: "Left-click fully grown wheat and carrots"
task.crop.detail: "Find every ripe crop. Left-click the tall golden wheat and the mature carrots with orange roots."
task.crop.progress: "Wheat <arg:0>/<arg:1> • Carrots <arg:2>/<arg:3>"
task.button.name: "Find Both Buttons"
task.button.hint: "Right-click the two hidden stone buttons"
task.button.detail: "Check the backs and sides of the posts for the two gray stone buttons. Right-click each one."
task.button.progress: "Stone buttons <arg:0>/2 • Right-click"
progress: "<arg:0> • <arg:1>/<arg:2>"
task.logs.name: "Chop Four Logs"
task.logs.hint: "Chop two spruce and two birch logs"
task.logs.detail: "Hold left-click with the axe to chop two dark spruce logs and two white birch logs."
task.logs.progress: "Spruce <arg:0>/2 • Birch <arg:1>/2"
task.ores.name: "Mine Two Kinds of Ore"
task.ores.hint: "Mine two copper and two iron ore blocks"
task.ores.detail: "Hold left-click with the pickaxe. Mine two copper ores with orange and green flecks and two iron ores with tan flecks."
task.ores.progress: "Copper <arg:0>/2 • Iron <arg:1>/2"
task.webs.name: "Clear the Cobwebs"
task.webs.hint: "Cut all six webs with the sword"
task.webs.detail: "Hold left-click with your sword to cut through each of the six cobwebs."
task.ladder.name: "Craft a Ladder"
task.ladder.hint: "Make an H with seven sticks"
task.ladder.detail: "Right-drag the sticks over both outside columns and the center square, then take the ladders."
task.boots.name: "Craft Leather Boots"
task.boots.hint: "Two pieces of leather in each outside column"
task.boots.detail: "Right-drag the leather over the top two squares in each outside column, then take the boots."
task.stack.name: "Build the Color Stack"
task.stack.hint: "Stack red, yellow, then blue"
task.stack.detail: "Right-click the top of the gold block with red concrete, then stack yellow and blue. Use the nearby stone step to reach the top."
task.light.name: "Light the Gold Pads"
task.light.hint: "Put a torch on each gold pad"
task.light.detail: "Hold the torches and right-click the top of each of the three gold floor blocks."
task.levers.name: "Flip the Three Levers"
task.levers.hint: "Right-click all three levers"
task.levers.detail: "Check the gray pedestals. Right-click each of the three levers you find."
task.treasure.name: "Take the Hidden Emerald"
task.treasure.hint: "Search the barrels for one emerald"
task.treasure.detail: "Right-click a barrel to open it. Press Esc to close it and try another. Left-click the emerald to take it."
task.checkpoints.name: "Run the Color Route"
task.checkpoints.hint: "Step on green, yellow, then red"
task.checkpoints.detail: "Run across the three pads in order. Start on green, then step on yellow, then red."
task.parkour.name: "Jump the Three Platforms"
task.parkour.hint: "Jump onto green, yellow, then red"
task.parkour.detail: "Use the jump key to hop onto the green platform, then jump across to yellow and red. Climb back up if you fall."
task.targets.name: "Hit Three Bullseyes"
task.targets.hint: "Shoot each of the three target blocks"
task.targets.detail: "Hold right-click to draw the bow. Aim at a target block and release to shoot. One hit on each target counts."
task.excavate.name: "Dig Up the Clay"
task.excavate.hint: "Dig three clay blocks with the shovel"
task.excavate.detail: "Hold left-click with the shovel on each blue-gray clay block. Look at the raised dig sites around the bay."
task.vines.name: "Prune the Vines"
task.vines.hint: "Cut three vine patches with shears"
task.vines.detail: "Select the shears and left-click the vines hanging on the front of each of the three wooden posts."
task.gates.name: "Open the Three Gates"
task.gates.hint: "Right-click each of the three gates"
task.gates.detail: "Find the wooden fence gates between the stone pillars. Right-click each closed gate once to open it."
task.books.name: "Return the Library Books"
task.books.hint: "Put a book in each of the three shelves"
task.books.detail: "Hold the books and right-click an empty slot on the front of each chiseled bookshelf."
task.candles.name: "Light the Candles"
task.candles.hint: "Light three candles with flint and steel"
task.candles.detail: "Hold the flint and steel and right-click each of the three yellow candles on the dark stands."
task.stairs.name: "Craft Oak Stairs"
task.stairs.hint: "Arrange six planks in a stair shape"
task.stairs.detail: "Right-click the crafting table. Put one plank in the top-left slot, two on the left of the middle row, and three across the bottom. Take the stairs."
task.plant.name: "Plant Three Saplings"
task.plant.hint: "Plant a birch sapling on each dirt mound"
task.plant.detail: "Hold the saplings and right-click the top of each of the three dirt blocks."
task.slalom.name: "Run the Slalom"
task.slalom.hint: "Round the walls and touch green, yellow, red"
task.slalom.detail: "Run around the end of each wall and step on the floor pads in order. Go right to green, left to yellow, then right to red."
